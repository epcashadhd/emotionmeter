<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>情緒溫度計 (Emotion Meter)</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/earlyaccess/cwtexyen.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        main: ['cwTeXYen', 'sans-serif'],
                        sans: ['cwTeXYen', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif'],

                }

    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'cwTeXYen', sans-serif;
        }
        /* Custom Slider Styles */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;

            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -20px;

        }
        input[type=range]::-moz-range-thumb {
            height: 56px;
            width: 56px;
            border-radius: 50%;
            background: #ffffff;

        input[type=range]::-webkit-slider-runnable-track {

            border-radius: 9999px;
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 16px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
            border-radius: 9999px;
        }

        /* Tablet Portrait Scaling */
        @media (min-width: 768px) and (orientation: portrait) {

            }
        }
        @media (min-width: 1024px) and (orientation: portrait) {
            .main-card-scale {
                transform: scale(1.8);
            }
        }

        /* Mobile Landscape Scaling */

            .main-card-scale {
                transform: scale(0.5);
            }
            .mobile-landscape-scale {
                transform: scale(0.45);

                padding-top: 52px !important;

            }
            .box-breathing-landscape-fix {

            }
            .box-breathing-landscape-fix .breathing-square-container {

        }
        @media (max-height: 500px) and (orientation: landscape) {
            .sphere-landscape-size-fix {
                transform: scale(0.6) !important;
                margin-top: -1.5rem !important;
                margin-bottom: -1rem !important;

            .sphere-landscape-instruction-fix {
                margin-top: -2.5rem !important;
                height: 4rem !important;

                left: 50% !important;
                transform: translateX(-50%) !important;
            }
            .sphere-landscape-instruction-fix p {
                white-space: pre !important;

        @media (min-height: 501px) and (max-height: 700px) and (orientation: landscape) {
            .main-card-scale {

        /* Animations */
        @keyframes fadeInUp {

                transform: translate(-50%, -50%);
            }

                opacity: 1;
                transform: translate(-50%, -50%);
            }

        @keyframes breathing {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }

                opacity: 0.9;
            }
        }
        @keyframes slowFadeInOut {
            0% { opacity: 0; transform: translateY(5px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-5px); }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Configuration ---
        const EMOTION_LEVELS = [
            { id: 1, label: "開心", color: "bg-green-400", description: "心情很好，\n充滿活力！" },
            { id: 2, label: "平靜", color: "bg-teal-400", description: "感覺放鬆，\n心情平和。" },
            { id: 3, label: "不安", color: "bg-blue-400", description: "有點不舒服，\n心裡怪怪的。" },
            { id: 4, label: "擔憂", color: "bg-yellow-500", description: "心裡七上八下，\n很煩惱。" },
            { id: 5, label: "傷心", color: "bg-indigo-500", description: "非常難過，\n想哭。" },
            { id: 6, label: "生氣", color: "bg-orange-600", description: "很生氣，\n心跳變快了！" },
            { id: 7, label: "憤怒", color: "bg-red-700", description: "氣炸了，\n快要爆炸了！" },
        ];

        // --- Assets & Smart Pathing ---
        // If we are in the AI Studio preview environment, use GitHub URLs.
        // If we are running locally or on GitHub Pages, use relative paths.
        const BASE_URL = window.location.hostname.includes('run.app') 
            ? "https://raw.githubusercontent.com/epcashadhd/emotionmeter/main/" 
            : "./";
            
        const LOGO_URL = `${BASE_URL}sign.png`;

        // --- Components ---

        function AbstractIcon({ type, color }) {
            if (type === 'meter') {
                return (
                    <svg viewBox="0 0 100 100" className="w-16 h-16 drop-shadow-sm">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style={{stopColor:'#FFEDD5', stopOpacity:1}} />
                                <stop offset="100%" style={{stopColor:'#FED7AA', stopOpacity:1}} />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="url(#grad1)" />
                        <path d="M50 25 V65" stroke="#F97316" strokeWidth="6" strokeLinecap="round" />
                        <circle cx="50" cy="70" r="10" fill="#F97316" />
                        <circle cx="65" cy="35" r="5" fill="#FDBA74" />
                        <circle cx="30" cy="60" r="3" fill="#FDBA74" />
                    </svg>
                );
            }
            if (type === 'search') {
                return (
                    <svg viewBox="0 0 100 100" className="w-16 h-16 drop-shadow-sm">
                         <defs>
                            <linearGradient id="gradSearch" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style={{stopColor:'#DBEAFE', stopOpacity:1}} />
                                <stop offset="100%" style={{stopColor:'#BFDBFE', stopOpacity:1}} />
                            </linearGradient>
                        </defs>
                         <circle cx="50" cy="50" r="45" fill="url(#gradSearch)" />
                         <circle cx="48" cy="48" r="18" stroke="#3B82F6" strokeWidth="5" fill="white" />
                         <line x1="62" y1="62" x2="75" y2="75" stroke="#3B82F6" strokeWidth="7" strokeLinecap="round" />
                         <circle cx="55" cy="40" r="4" fill="#93C5FD" />
                    </svg>
                );
            }
            if (type === 'breath') {
                return (
                    <svg viewBox="0 0 100 100" className="w-16 h-16 drop-shadow-sm">
                        <circle cx="50" cy="50" r="45" fill="#ECFDF5" />
                        <path d="M30 55 Q 50 25 70 55" stroke="#34D399" strokeWidth="4" fill="none" strokeLinecap="round" />
                        <path d="M30 65 Q 50 35 70 65" stroke="#6EE7B7" strokeWidth="4" fill="none" strokeLinecap="round" />
                        <circle cx="50" cy="45" r="2" fill="#34D399" />
                    </svg>
                );
            }
            return null;
        }

        function ReverseArrowIcon() {
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 text-slate-500">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
            );
        }

        function FloatingLogo({ visible, show }) {
            const [isOpen, setIsOpen] = useState(false);

            if (!visible) return null;

            return (
                <div 
                    className={`fixed bottom-6 right-6 z-50 flex flex-col items-end transition-opacity duration-700 ease-in-out ${show ? 'opacity-100' : 'opacity-0'}`}
                    onMouseLeave={() => setIsOpen(false)}
                >
                    {/* Message Bubble */}
                    <div 
                        className={`mb-2 bg-white px-4 py-2 rounded-xl shadow-lg border border-slate-100 transform transition-all duration-500 ease-out origin-bottom-right ${isOpen ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-90 translate-y-4 pointer-events-none'}`}
                    >
                        <p className="text-slate-600 font-bold text-sm whitespace-nowrap">本平台由教育心理學家設計</p>
                        {/* Triangle pointer */}
                        <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-white transform rotate-45 border-r border-b border-slate-100"></div>
                    </div>

                    {/* Logo Button - Transparent & Smaller */}
                    <button 
                        type="button"
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-10 h-10 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-300 focus:outline-none"
                    >
                        <img src={LOGO_URL} alt="Logo" className="w-full h-full object-contain drop-shadow-md" />
                    </button>
                </div>
            );
        }

        function MainMenu({ onNavigate, show }) {
            return (
                <div className={`min-h-screen w-full bg-[#FDFBF7] flex flex-col items-center justify-center p-6 font-main pb-32 transition-opacity duration-700 ease-in-out select-none ${show ? 'opacity-100' : 'opacity-0'}`}>
                    <div className="max-w-md w-full space-y-8">
                        <div className="text-center space-y-2">
                            <h1 className="text-5xl font-bold text-slate-700 tracking-tight mb-2">情緒調控工具</h1>
                            <p className="text-xl text-slate-500">選擇適合你的練習</p>
                        </div>

                        <div className="space-y-4">
                            <button 
                                onClick={() => onNavigate('meter')}
                                className="w-full bg-white hover:bg-orange-50 active:bg-orange-100 border-2 border-orange-100 hover:border-orange-200 p-6 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 group flex items-center gap-6"
                            >
                                <AbstractIcon type="meter" />
                                <div className="text-left">
                                    <h3 className="text-2xl font-bold text-slate-700 group-hover:text-orange-800 transition-colors">情緒溫度計</h3>
                                    <p className="text-slate-400 mt-1">覺察當下的情緒能量</p>
                                </div>
                            </button>

                            <button 
                                onClick={() => onNavigate('explorer')}
                                className="w-full bg-white hover:bg-blue-50 active:bg-blue-100 border-2 border-blue-100 hover:border-blue-200 p-6 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 group flex items-center gap-6"
                            >
                                <AbstractIcon type="search" />
                                <div className="text-left">
                                    <h3 className="text-2xl font-bold text-slate-700 group-hover:text-blue-800 transition-colors">情緒探索器</h3>
                                    <p className="text-slate-400 mt-1">辨識你的情緒</p>
                                </div>
                            </button>

                            <button 
                                onClick={() => onNavigate('breathing')}
                                className="w-full bg-white hover:bg-green-50 active:bg-green-100 border-2 border-green-100 hover:border-green-200 p-6 rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 group flex items-center gap-6"
                            >
                                <AbstractIcon type="breath" />
                                <div className="text-left">
                                    <h3 className="text-2xl font-bold text-slate-700 group-hover:text-green-800 transition-colors">呼吸練習</h3>
                                    <p className="text-slate-400 mt-1">調節呼吸，放鬆身心</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function BoxBreathingTool() {
            const [isActive, setIsActive] = useState(true); // Auto-start
            const [startupPhase, setStartupPhase] = useState(0); // 0: Flash instruction, 1: Show labels, 2: Highlight first label, 3: Start animation
            const startupPhaseRef = useRef(0);
            const [phase, setPhase] = useState(0); // 0: Inhale, 1: Hold, 2: Exhale, 3: Hold
            const [timeLeft, setTimeLeft] = useState(4);
            const [progress, setProgress] = useState(0);
            const [animTime, setAnimTime] = useState(0);
            const requestRef = useRef(null);
            const startTimeRef = useRef(null);
            // Reduced particles from 120 to 80 for better performance
            const [particles] = useState(() => Array.from({ length: 80 }).map((_, i) => ({
                id: i,
                angle: Math.random() * Math.PI * 2,
                distance: 12 + Math.random() * 26, // percentage from center
                speed: 0.5 + Math.random() * 1.5,
                size: 4 + Math.random() * 6,
                opacity: 0.2 + Math.random() * 0.6
            })));

            useEffect(() => {
                const updateStartup = (val) => {
                    setStartupPhase(val);
                    startupPhaseRef.current = val;
                };
                const t1 = setTimeout(() => updateStartup(1), 3000);
                const t2 = setTimeout(() => updateStartup(2), 4000);
                const t3 = setTimeout(() => updateStartup(3), 5000);
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
            }, []);

            useEffect(() => {
                if (!isActive) {
                    cancelAnimationFrame(requestRef.current);
                    setPhase(0);
                    setTimeLeft(4);
                    setProgress(0);
                    startTimeRef.current = null;
                    return;
                }

                const CYCLE_DURATION = 4000; // 4 seconds per edge

                const animate = (time) => {
                    setAnimTime(time / 1000);

                    if (startupPhaseRef.current < 3) {
                        startTimeRef.current = null;
                        setProgress(0);
                        setPhase(0);
                        setTimeLeft(4);
                        requestRef.current = requestAnimationFrame(animate);
                        return;
                    }

                    if (!startTimeRef.current) startTimeRef.current = time;
                    const elapsed = time - startTimeRef.current;
                    let currentProgress = elapsed / CYCLE_DURATION;

                    if (currentProgress >= 1) {
                        const overflow = elapsed % CYCLE_DURATION;
                        currentProgress = overflow / CYCLE_DURATION;
                        startTimeRef.current = time - overflow;
                        setPhase(prev => {
                            const nextPhase = (prev + 1) % 4;
                            if (navigator.vibrate) navigator.vibrate(60);
                            return nextPhase;
                        });
                    }

                    setProgress(currentProgress);
                    setTimeLeft(Math.ceil(4 - (currentProgress * 4)));

                    requestRef.current = requestAnimationFrame(animate);
                };

                requestRef.current = requestAnimationFrame(animate);

                return () => cancelAnimationFrame(requestRef.current);
            }, [isActive]); // Removed startupPhase from dependencies to prevent restarts

            const continuousTime = animTime;

            return (
                <div className="flex flex-col items-center justify-center w-full h-full animate-[fadeInUp_0.5s_ease-out] box-breathing-landscape-fix gap-12 sm:gap-16 pb-8 sm:pb-12">
                    <div className="relative w-56 h-56 sm:w-72 sm:h-72 flex items-center justify-center breathing-square-container -mt-8 sm:-mt-12">
                        
                        {/* Outside Edge Text */}
                        <div className="absolute -top-8 sm:-top-10 left-0 right-0 text-center transition-opacity duration-1000 ease-in-out" style={{ opacity: startupPhase < 1 ? 0 : (startupPhase >= 3 ? (phase === 0 ? 1 : 0.2) : (startupPhase === 2 ? 1 : 0.2)) }}>
                            <span className="text-lg sm:text-xl font-bold text-slate-600 tracking-widest whitespace-nowrap">吸氣</span>
                        </div>
                        <div className="absolute -right-10 sm:-right-16 top-0 bottom-0 flex items-center justify-center transition-opacity duration-1000 ease-in-out" style={{ opacity: startupPhase < 1 ? 0 : (startupPhase >= 3 ? (phase === 1 ? 1 : 0.2) : 0.2) }}>
                            <span className="text-lg sm:text-xl font-bold text-slate-600 tracking-widest whitespace-nowrap" style={{ writingMode: 'vertical-rl' }}>屏住呼吸</span>
                        </div>
                        <div className="absolute -bottom-8 sm:-bottom-10 left-0 right-0 text-center transition-opacity duration-1000 ease-in-out" style={{ opacity: startupPhase < 1 ? 0 : (startupPhase >= 3 ? (phase === 2 ? 1 : 0.2) : 0.2) }}>
                            <span className="text-lg sm:text-xl font-bold text-slate-600 tracking-widest whitespace-nowrap">呼氣</span>
                        </div>
                        <div className="absolute -left-10 sm:-left-16 top-0 bottom-0 flex items-center justify-center transition-opacity duration-1000 ease-in-out" style={{ opacity: startupPhase < 1 ? 0 : (startupPhase >= 3 ? (phase === 3 ? 1 : 0.2) : 0.2) }}>
                            <span className="text-lg sm:text-xl font-bold text-slate-600 tracking-widest whitespace-nowrap" style={{ writingMode: 'vertical-rl' }}>屏住呼吸</span>
                        </div>

                        {/* Internal Random Particles */}
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                            {particles.map(p => {
                                let currentDist = 0;
                                const minScale = 0.35; // Keep particles visible and loose during exhale
                                if (phase === 0) currentDist = p.distance * (minScale + (1 - minScale) * progress);
                                else if (phase === 1) currentDist = p.distance;
                                else if (phase === 2) currentDist = p.distance * (minScale + (1 - minScale) * (1 - progress));
                                else if (phase === 3) currentDist = p.distance * minScale;

                                const floatX = Math.sin(continuousTime * p.speed + p.id) * 4;
                                const floatY = Math.cos(continuousTime * p.speed + p.id) * 4;

                                const currentAngle = p.angle + continuousTime * 0.15 * (p.id % 2 === 0 ? 1 : -1);

                                const x = Math.cos(currentAngle) * currentDist + floatX;
                                const y = Math.sin(currentAngle) * currentDist + floatY;

                                return (
                                    <div 
                                        key={p.id}
                                        className="absolute rounded-full bg-blue-400"
                                        style={{
                                            width: p.size,
                                            height: p.size,
                                            opacity: p.opacity,
                                            left: `calc(50% + ${x}%)`,
                                            top: `calc(50% + ${y}%)`,
                                            transform: 'translate(-50%, -50%)',
                                            transition: isActive ? 'none' : 'all 0.5s ease'
                                        }}
                                    />
                                )
                            })}
                        </div>

                        {/* SVG Track and Particle */}
                        <svg className="absolute inset-0 w-full h-full z-10" viewBox="0 0 280 280">
                            {/* Base Track - More obvious */}
                            <rect x="12" y="12" width="256" height="256" rx="24" fill="none" stroke="#E2E8F0" strokeWidth="4" pathLength="100" />
                                  
                            {/* Moving Particle - More obvious glow */}
                            <rect x="12" y="12" width="256" height="256" rx="24" fill="none" stroke="#3B82F6" strokeWidth="12" strokeLinecap="round"
                                  pathLength="100" 
                                  strokeDasharray="0.1 100" 
                                  strokeDashoffset={-(phase * 25 + progress * 25)} 
                                  className={startupPhase < 3 ? "animate-pulse" : ""}
                                  style={{ filter: 'drop-shadow(0 0 16px rgba(59,130,246,0.9)) drop-shadow(0 0 8px rgba(59,130,246,0.6))' }} />
                        </svg>
                    </div>
                    <div className="text-center animate-[fadeInUp_0.5s_ease-out] guide-sentence-container">
                        <p className="text-slate-500 text-2xl sm:text-3xl tracking-wide font-bold opacity-100">
                            請跟隨光點，慢慢呼吸...
                        </p>
                    </div>
                </div>
            );
        }

        function BreathingExercise({ onBack, show }) {
            const [exerciseType, setExerciseType] = useState(null); // null | 'sphere44' | 'sphere478' | 'square' | 'body'
            const [showSphereOptions, setShowSphereOptions] = useState(false);
            const [showSquareOptions, setShowSquareOptions] = useState(false);
            const [selectedPattern, setSelectedPattern] = useState(null);
            const [selectedDuration, setSelectedDuration] = useState(null);
            const [duration, setDuration] = useState(null);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const [exerciseStartTime, setExerciseStartTime] = useState(null);
            const [totalProgress, setTotalProgress] = useState(0);
            const [phase, setPhase] = useState('prepare'); // 'prepare' | 'inhale' | 'hold-in' | 'exhale' | 'hold-out'
            const [bubbles, setBubbles] = useState([]);
            const [seconds, setSeconds] = useState(0);

                        distance: 100 + Math.random() * 100,
                        size: 10 + Math.random() * 20,
                        delay: Math.random() * 0.5

                    setBubbles(newBubbles);
                    const timer = setTimeout(() => setBubbles([]), 3500);
                    return () => clearTimeout(timer);

            // Timer logic
            useEffect(() => {
                let interval;
                if (exerciseType && exerciseType.startsWith('sphere')) {
                    const is478 = exerciseType === 'sphere478';
                    const INHALE_TIME = 4000;
                    const HOLD_IN_TIME = is478 ? 7000 : 1000;
                    const EXHALE_TIME = is478 ? 8000 : 4000;
                    const HOLD_OUT_TIME = is478 ? 0 : 1000;
                    const TOTAL_CYCLE = INHALE_TIME + HOLD_IN_TIME + EXHALE_TIME + HOLD_OUT_TIME;
                    
                    if (phase === 'prepare') {
                        const isIntro = exerciseType === 'sphere-intro';
                        setGuideText(isIntro ? '' : '請跟隨圓形的舒張，\n慢慢呼吸...');
                        if (isIntro) return;
                        const timer = setTimeout(() => {
                            setPhase('inhale');
                            startTimeRef.current = Date.now();
                        }, 3000);
                        return () => clearTimeout(timer);
                    }

                    const updateTimer = () => {
                        if (!startTimeRef.current) startTimeRef.current = Date.now();
                        const elapsed = Date.now() - startTimeRef.current;
                        const cycleTime = elapsed % TOTAL_CYCLE;

                        let newPhase = phase;
                        let newSeconds = seconds;

                        if (cycleTime < INHALE_TIME) {
                            newPhase = 'inhale';
                            newSeconds = 4 - Math.floor(cycleTime / 1000);
                        } else if (cycleTime < INHALE_TIME + HOLD_IN_TIME) {
                            newPhase = 'hold-in';
                            if (is478) {
                                const holdProgress = cycleTime - INHALE_TIME;
                                newSeconds = 7 - Math.floor(holdProgress / 1000);
                            } else {
                                newSeconds = 4;
                            }
                        } else if (cycleTime < INHALE_TIME + HOLD_IN_TIME + EXHALE_TIME) {
                            newPhase = 'exhale';
                            const exhaleProgress = cycleTime - (INHALE_TIME + HOLD_IN_TIME);
                            const totalExhaleSecs = is478 ? 8 : 4;
                            newSeconds = totalExhaleSecs - Math.floor(exhaleProgress / 1000);
                        } else {
                            newPhase = 'hold-out';
                            newSeconds = 1;
                        }

                        if (newPhase !== phase) {
                            setPhase(newPhase);
                            if (newPhase === 'inhale') {
                                if (navigator.vibrate) navigator.vibrate(50);
                            } else if (newPhase === 'exhale') {
                                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                            }
                        }
                        if (newSeconds !== seconds) {
                            setSeconds(newSeconds);
                        }
                    };

                    interval = setInterval(updateTimer, 50);
                    return () => clearInterval(interval);
                }
                return () => clearInterval(interval);

                    </div>

                    <style>{`

        }

        function EmotionTreeTool() {
            const [growth, setGrowth] = useState(0);
            const [isPressing, setIsPressing] = useState(false);
            const [isComplete, setIsComplete] = useState(false);
            const [sway, setSway] = useState(0);
            const [cycleTime, setCycleTime] = useState(0); // 0-12s cycle
            const [musicStarted, setMusicStarted] = useState(false);
            
            const audioRef = useRef(null);
            const growthRef = useRef(0);
            const lastTimeRef = useRef(null);
            const treeStructureRef = useRef(null);
            const cycleRef = useRef(0);
            const fadeIntervalRef = useRef(null);
            const canvasRef = useRef(null);

            const growInstantly = () => {
                growthRef.current = 1;
                setGrowth(1);
                setIsComplete(true);
                setMusicStarted(true);
            };

            useEffect(() => {
                const handleGrow = () => growInstantly();
                window.addEventListener('grow-tree-instantly', handleGrow);
                return () => window.removeEventListener('grow-tree-instantly', handleGrow);
            }, []);

            // Generate tree structure once
            if (!treeStructureRef.current) {
                const generateTree = (depth, angle, length, curve = 0, thicknessScale = 1) => {
                    if (depth === 0) return null;
                    const branches = [];
                    
                    // More varied branch counts for a more natural, non-symmetric look
                    let numBranches = 0;
                    if (depth > 1) {
                        const rand = Math.random();
                        if (depth === 7) {
                            // 第一層分出 4 根主枝 (Trunk)
                            numBranches = 4;
                        } else if (depth === 6) {
                            // 第二層分枝數量
                            numBranches = rand > 0.5 ? 3 : 4;
                        } else if (depth > 5) {
                            numBranches = rand > 0.3 ? 2 : 3;
                        } else if (depth > 2) {
                            numBranches = rand > 0.4 ? 3 : 2;
                        } else {
                            numBranches = rand > 0.3 ? 2 : 3;
                        }
                    }
                    
                    for (let i = 0; i < numBranches; i++) {
                        // 90% layer grows upward: tighten spread and angle constraints
                        let spread = 20 + Math.random() * 30;
                        if (depth === 6) spread = 35 + Math.random() * 25; // Layer 2
                        else if (depth === 5) spread = 30 + Math.random() * 20; // Layer 3: Increase spread to prevent sticking
                        else if (depth >= 2) spread = 15 + Math.random() * 25;

                        let angleOffset = 0;
                        if (numBranches === 1) {
                            angleOffset = Math.random() * 20 - 10;
                        } else if (numBranches === 2) {
                            angleOffset = (i === 0 ? -spread/2 : spread/2) + (Math.random() * 15 - 7.5);
                        } else {
                            const step = spread / (numBranches - 1);
                            angleOffset = (-spread/2 + i * step) + (Math.random() * 10 - 5);
                        }
                        
                        let newAngle = angle + angleOffset;
                        if (depth >= 2) newAngle = Math.max(-35, Math.min(35, newAngle));

                        let lengthScale = 0.58 + Math.random() * 0.22;
                        // Shorten Layer 2 (depth 6) to improve proportions
                        if (depth === 6) lengthScale *= 0.75;
                        // Shorten layers 5, 6, 7 (depth 3, 2, 1) to keep tree on screen
                        if (depth <= 3) lengthScale *= 0.7;

                        // Upward bias: central branches (angle near 0) grow longer to avoid flat top
                        const upwardBoost = Math.cos(newAngle * Math.PI / 180);
                        lengthScale *= (1 + Math.pow(upwardBoost, 4) * 0.35);

                        if (depth === 7) lengthScale = 0.45 + Math.random() * 0.15;
                        const newLength = length * lengthScale;
                        
                        const nextCurve = (Math.random() * 6 - 3);
                        
                        let nextThicknessScale = 0.7 + Math.random() * 0.6;
                        let staggerOffset = 1.0; // 預設從頂端長出

                        if (depth === 7) {
                            nextThicknessScale = 1.6;
                            // Raise branch starting points to 85% - 94% of trunk height
                            // This keeps the lower trunk clean and pushes the canopy higher
                            staggerOffset = 0.85 + (i * 0.03); 
                        } else if (depth === 6) {
                            // Layer 2 branches: slightly stagger Layer 3 children to avoid sticking
                            staggerOffset = 0.88 + (i * 0.03);
                            if (i >= 3) nextThicknessScale *= 0.6;
                        }
                        
                        branches.push({
                            ...generateTree(depth - 1, newAngle, newLength, nextCurve, nextThicknessScale),
                            staggerOffset
                        });
                    }

                    // Add extra fine branches (twigs) for depths 3-6 to increase leaf density
                    // Removed depth 7 (trunk) to keep the lower section clean
                    if (depth >= 3 && depth <= 6) {
                        const numTwigs = 1 + Math.floor(Math.random() * 2);
                        for (let t = 0; t < numTwigs; t++) {
                            const twigAngle = angle + (Math.random() * 80 - 40);
                            const twigLength = length * (0.25 + Math.random() * 0.2);
                            const twigThickness = thicknessScale * 0.4;
                            const twigCurve = (Math.random() * 10 - 5);
                            branches.push({
                                ...generateTree(depth - 1, twigAngle, twigLength, twigCurve, twigThickness),
                                staggerOffset: 0.4 + Math.random() * 0.5 // Grow from along the branch
                            });
                        }
                    }

                    const result = { angle, length, branches, curve, thicknessScale, id: Math.random() };

                    // 為樹幹 (depth 7) 預先計算根部與鋸齒數據，防止生長時抖動
                    if (depth === 7) {
                        const numRoots = 7 + Math.floor(Math.random() * 3);
                        const roots = [];
                        for (let r = 0; r < numRoots; r++) {
                            const rt = r / (numRoots - 1);
                            const rAngle = (rt < 0.5 ? -30 - Math.random() * 40 : 30 + Math.random() * 40);
                            const rLen = (12 + Math.random() * 18);
                            const subAngle = rAngle + (Math.random() * 50 - 25);
                            const subLen = rLen * (0.5 + Math.random() * 0.3);
                            roots.push({ rt, rAngle, rLen, subAngle, subLen });
                        }
                        result.roots = roots;
                        result.topNoise = Array.from({ length: 6 }, () => Math.random() * 3 - 1.5);
                        result.bottomNoise = Math.random() * 2.5;
                    }

                    return result;
                };
                // Increase depth to 8 for more detail and density
                // 根據螢幕寬度動態調整起始長度，手機與平板版調大，桌面版維持 60 以防頂部遮擋
                const isLandscape = window.innerWidth > window.innerHeight && window.innerHeight < 500;
                const initialLength = isLandscape ? 120 : (window.innerWidth < 640 ? 85 : (window.innerWidth < 1024 ? 75 : 60));
                treeStructureRef.current = generateTree(7, 0, initialLength, 0);
            }

            useEffect(() => {
                const audio = new Audio(BASE_URL + 'music2.mp3');
                audio.loop = true;
                audioRef.current = audio;
                
                const handleKeyDown = (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        setIsPressing(true);
                        setMusicStarted(true);
                    }
                };
                const handleKeyUp = (e) => {
                    if (e.code === 'Space') {
                        setIsPressing(false);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    audio.pause();
                    if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, []);

            useEffect(() => {
                if (musicStarted && !isComplete) {
                    if (audioRef.current) {
                        audioRef.current.volume = 1;
                        audioRef.current.play().catch(e => console.log(e));
                    }
                } else if (isComplete) {
                    // Fade out music instead of stopping suddenly
                    const audio = audioRef.current;
                    if (audio) {
                        let vol = audio.volume;
                        if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);
                        fadeIntervalRef.current = setInterval(() => {
                            vol -= 0.05;
                            if (vol <= 0) {
                                if (audioRef.current) {
                                    audioRef.current.volume = 0;
                                    audioRef.current.pause();
                                }
                                if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);
                                fadeIntervalRef.current = null;
                            } else {
                                if (audioRef.current) audioRef.current.volume = Math.max(0, vol);
                            }
                        }, 200);
                    }
                } else {
                    audioRef.current?.pause();
                }
            }, [musicStarted, isComplete]);

            useEffect(() => {
                const handleGlobalUp = () => setIsPressing(false);
                window.addEventListener('mouseup', handleGlobalUp);
                window.addEventListener('touchend', handleGlobalUp);
                window.addEventListener('touchcancel', handleGlobalUp);
                return () => {
                    window.removeEventListener('mouseup', handleGlobalUp);
                    window.removeEventListener('touchend', handleGlobalUp);
                    window.removeEventListener('touchcancel', handleGlobalUp);
                };
            }, []);

            useEffect(() => {
                let frame;
                const drawBranch = (ctx, branch, x, y, currentAngle, currentGrowth, depth, currentSway) => {
                    if (!branch) return;
                    
                    const getThreshold = (d, sOffset) => {
                        if (d === 8) return 0;
                        // 如果有錯位偏移，根據偏移量動態計算啟動時間
                        // 確保分枝在樹幹長到該位置時準時冒出
                        if (d === 7 && sOffset) return sOffset * 0.1; 
                        if (d === 7) return 0.08;
                        if (d >= 2) return 0.08 + (7 - d) * 0.05;
                        return 0.45;
                    };
                    
                    const branchThreshold = getThreshold(depth, branch.staggerOffset);
                    const growthSpeed = depth > 1 ? 6 : 1.8;
                    const localGrowth = Math.max(0, Math.min(1, (currentGrowth - branchThreshold) * growthSpeed));
                    
                    if (localGrowth <= 0) return;

                    const angleOffset = depth < 6 ? currentSway * (6 - depth) * 0.5 : 0;
                    const angleRad = (currentAngle + branch.angle + angleOffset) * Math.PI / 180;
                    const endX = x + branch.length * Math.sin(angleRad) * localGrowth;
                    const endY = y - branch.length * Math.cos(angleRad) * localGrowth;

                    const midX = x + (endX - x) / 2 + Math.cos(angleRad + Math.PI/2) * (branch.curve || 0) * localGrowth;
                    const midY = y + (endY - y) / 2 + Math.sin(angleRad + Math.PI/2) * (branch.curve || 0) * localGrowth;

                    // Draw Branch
                    ctx.beginPath();
                    
                    // Dynamic Thickening: 隨生長進度平滑增加粗度
                    // 調整基礎厚度，確保銜接處足夠粗壯
                    const nextLayerWidth = (7 * 0.8 + 0.5) * 1.6; // 匹配加厚後的第二層
                    const trunkBaseWidth = (8 * 0.8 + 0.5) * 2.2;
                    
                    const baseWidth = (depth * 0.8 + 0.5) * (branch.thicknessScale || 1);
                    const growthFactor = 0.5 + 0.5 * localGrowth;
                    ctx.lineWidth = baseWidth * growthFactor;
                    
                    ctx.lineCap = "round";
                    ctx.strokeStyle = depth > 4 ? "#3E2723" : (depth > 2 ? "#795548" : "#4CAF50");

                    if (depth === 8) {
                        // 為第一層樹幹實現平滑的手繪形狀
                        const segments = 30; // 增加片段以提高平滑度
                        const leftPoints = [];
                        const rightPoints = [];
                        
                        // 預先計算完整路徑參數以實現平滑生長
                        const fullAngleRad = (currentAngle + branch.angle) * Math.PI / 180;
                        const fullEndX = x + branch.length * Math.sin(fullAngleRad);
                        const fullEndY = y - branch.length * Math.cos(fullAngleRad);
                        const fullMidX = x + (fullEndX - x) / 2 + Math.cos(fullAngleRad + Math.PI/2) * (branch.curve || 0);
                        const fullMidY = y + (fullEndY - y) / 2 + Math.sin(fullAngleRad + Math.PI/2) * (branch.curve || 0);

                        for (let i = 0; i <= segments; i++) {
                            // 使用 localGrowth 作為上限，並均勻分佈片段，實現平滑生長
                            const t = (i / segments) * localGrowth;
                            
                            // 計算中心路徑
                            const tx = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * fullMidX + t * t * fullEndX;
                            const ty = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * fullMidY + t * t * fullEndY;
                            
                            // 底部擴張 (Flare)：底部較寬，頂部精確收縮到與下一層分枝一致
                            const currentTaperWidth = trunkBaseWidth * (1 - t) + nextLayerWidth * t;
                            const flare = (1 - t) * (1 - t) * 15;
                            const currentHalfWidth = (currentTaperWidth / 2) * growthFactor + flare;
                            
                            const noiseL = Math.sin(branch.id * 1000 + i * 0.8) * 0.5;
                            const noiseR = Math.cos(branch.id * 500 + i * 0.8) * 0.5;
                            
                            leftPoints.push({ x: tx - currentHalfWidth + noiseL, y: ty });
                            rightPoints.push({ x: tx + currentHalfWidth + noiseR, y: ty });
                        }
                        
                        if (leftPoints.length > 1) {
                            ctx.beginPath();
                            // 底部表面：使用預設噪點，消除抖動
                            ctx.moveTo(leftPoints[0].x, leftPoints[0].y);
                            const bottomMidX = (leftPoints[0].x + rightPoints[0].x) / 2;
                            const bottomMidY = (leftPoints[0].y + rightPoints[0].y) / 2 + (branch.bottomNoise || 0) * localGrowth;
                            ctx.quadraticCurveTo(bottomMidX, bottomMidY, rightPoints[0].x, rightPoints[0].y);
                            
                            // 右側邊緣
                            for (let i = 1; i < rightPoints.length; i++) ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
                            
                            // 頂部表面：使用預設噪點，且生長初期就可見
                            const topR = rightPoints[rightPoints.length - 1];
                            const topL = leftPoints[leftPoints.length - 1];
                            const steps = 5;
                            for (let j = 1; j <= steps; j++) {
                                const jt = j / steps;
                                const jx = topR.x * (1 - jt) + topL.x * jt;
                                // 噪點隨生長進度縮放
                                const noise = (branch.topNoise ? branch.topNoise[j] : 0) * localGrowth;
                                const jy = topR.y * (1 - jt) + topL.y * jt + noise;
                                ctx.lineTo(jx, jy);
                            }

                            // 左側邊緣
                            for (let i = leftPoints.length - 2; i >= 0; i--) ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
                            ctx.closePath();
                            
                            ctx.fillStyle = "#3E2723";
                            ctx.fill();
                            
                            ctx.strokeStyle = "#1A0F0D";
                            ctx.lineWidth = 1;
                            ctx.stroke();
                            
                            // 根部細節：使用預先計算的數據，消除抖動
                            if (localGrowth > 0.05 && branch.roots) {
                                const rootG = Math.min(1, (localGrowth - 0.05) * 3);
                                ctx.strokeStyle = "#1A0F0D";
                                
                                branch.roots.forEach(root => {
                                    // 起點 (在底部邊緣)
                                    const rx = leftPoints[0].x * (1 - root.rt) + rightPoints[0].x * root.rt;
                                    const ry = leftPoints[0].y * (1 - root.rt) + rightPoints[0].y * root.rt;
                                    
                                    const rLen = root.rLen * rootG;
                                    const rAngleRad = root.rAngle * Math.PI / 180;
                                    const rex = rx + rLen * Math.sin(rAngleRad);
                                    const rey = ry + rLen * Math.cos(rAngleRad);
                                    
                                    // 繪製主根，帶有收縮效果
                                    const rootSegments = 6;
                                    let lastRx = rx;
                                    let lastRy = ry;
                                    for (let i = 1; i <= rootSegments; i++) {
                                        const t = i / rootSegments;
                                        const currX = rx + (rex - rx) * t;
                                        const currY = ry + (rey - ry) * t;
                                        
                                        // 基部較厚 (2.5)，末端較細 (0.5)
                                        const taper = 2.5 * (1 - t * 0.8);
                                        ctx.lineWidth = taper * growthFactor;
                                        
                                        ctx.beginPath();
                                        ctx.moveTo(lastRx, lastRy);
                                        ctx.lineTo(currX, currY);
                                        ctx.stroke();
                                        
                                        lastRx = currX;
                                        lastRy = currY;
                                    }
                                    
                                    // 根部二級分支
                                    if (rootG > 0.5) {
                                        const subG = (rootG - 0.5) * 2;
                                        const subLen = root.subLen * subG;
                                        const subAngleRad = root.subAngle * Math.PI / 180;
                                        
                                        // 從主根中間分叉
                                        const rmx = rx + (rex - rx) * 0.6;
                                        const rmy = ry + (rey - ry) * 0.6;
                                        
                                        ctx.lineWidth = 0.8 * growthFactor;
                                        ctx.beginPath();
                                        ctx.moveTo(rmx, rmy);
                                        ctx.lineTo(rmx + subLen * Math.sin(subAngleRad), rmy + subLen * Math.cos(subAngleRad));
                                        ctx.stroke();
                                    }
                                });
                            }
                        }
                    } else {
                        // 普通樹枝繪製：僅在末端分枝（無子代或深度極低）時進行尖端收縮
                        // 這樣可以確保層與層之間的銜接處厚度一致，看起來更自然
                        const hasChildren = branch.branches && branch.branches.length > 0;
                        const shouldTaper = !hasChildren || depth <= 2;

                        if (shouldTaper) {
                            const branchSegments = 8;
                            let lastX = x;
                            let lastY = y;
                            
                            for (let i = 1; i <= branchSegments; i++) {
                                const t = i / branchSegments;
                                const tx = t < 0.5 ? x + (midX - x) * (t * 2) : midX + (endX - midX) * ((t - 0.5) * 2);
                                const ty = t < 0.5 ? y + (midY - y) * (t * 2) : midY + (endY - midY) * ((t - 0.5) * 2);
                                
                                // 寬度從 baseWidth 漸變到末端
                                const taper = 1 - (t * 0.85); 
                                ctx.lineWidth = Math.max(0.6, baseWidth * taper * growthFactor);
                                
                                ctx.beginPath();
                                ctx.moveTo(lastX, lastY);
                                ctx.lineTo(tx, ty);
                                ctx.stroke();
                                
                                lastX = tx;
                                lastY = ty;
                            }
                        } else {
                            // 中間分枝：不收縮，保持厚度以連接下一層
                            ctx.lineWidth = baseWidth * growthFactor;
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.lineTo(midX, midY);
                            ctx.lineTo(endX, endY);
                            ctx.stroke();
                        }
                    }

                    // Draw Children
                    branch.branches.forEach(b => {
                        let startX = endX;
                        let startY = endY;
                        
                        // 如果有錯位偏移 (主要用於樹幹到分枝的過渡)
                        if (b.staggerOffset && b.staggerOffset < 1.0) {
                            const t = b.staggerOffset;
                            // 使用二次貝塞爾曲線公式計算偏移起點
                            startX = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * midX + t * t * endX;
                            startY = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * midY + t * t * endY;
                        }
                        
                        drawBranch(ctx, b, startX, startY, currentAngle + branch.angle, currentGrowth, depth - 1, currentSway);
                    });
                    
                    // Draw Leaves
                    // User requested no leaves on layer 3 (depth 5) and layer 4 (depth 4). 
                    // Leaves now start from layer 5 (depth 3) down to layer 7 (depth 1).
                    if (depth <= 3) {
                        // 調整葉子生長節奏：30秒 (0.5) 開始冒芽，55秒 (0.9) 達到最茂盛
                        const leafOpacity = Math.max(0, Math.min(1, (currentGrowth - 0.5) * 2.5)) * localGrowth;
                        if (leafOpacity > 0) {
                            ctx.save();
                            ctx.globalAlpha = leafOpacity * 0.6;
                            // Color variation based on depth to add depth and avoid "broccoli" look
                            ctx.fillStyle = depth <= 2 ? "#A5D6A7" : "#81C784";
                            ctx.beginPath();
                            ctx.arc(endX, endY, depth <= 2 ? 6 : 4, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Lush clusters for all leafy layers (depth 1-3)
                            if (depth <= 3) {
                                ctx.globalAlpha = leafOpacity * 0.5;
                                ctx.fillStyle = "#C8E6C9";
                                ctx.beginPath(); ctx.arc(endX + 5, endY - 4, 3, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.fillStyle = "#81C784";
                                ctx.beginPath(); ctx.arc(endX - 5, endY + 3, 3.5, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.globalAlpha = leafOpacity * 0.4;
                                ctx.fillStyle = "#66BB6A";
                                ctx.beginPath(); ctx.arc(endX + 3, endY + 5, 2.5, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.fillStyle = "#4CAF50";
                                ctx.beginPath(); ctx.arc(endX - 3, endY - 5, 2.8, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.fillStyle = "#A5D6A7";
                                ctx.beginPath(); ctx.arc(endX + 7, endY, 2.2, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.fillStyle = "#81C784";
                                ctx.beginPath(); ctx.arc(endX - 7, endY, 2.2, 0, Math.PI * 2); ctx.fill();
                            }
                            
                            // Extra lushness for the very tips and the starting leafy layer
                            if (depth === 1 || depth === 3) {
                                ctx.globalAlpha = leafOpacity * 0.5;
                                ctx.fillStyle = "#A5D6A7";
                                ctx.beginPath(); ctx.arc(endX + 8, endY + 2, 2.5, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.fillStyle = "#C8E6C9";
                                ctx.beginPath(); ctx.arc(endX - 8, endY - 2, 3, 0, Math.PI * 2); ctx.fill();
                                
                                ctx.globalAlpha = leafOpacity * 0.4;
                                ctx.fillStyle = "#E8F5E9";
                                ctx.beginPath(); ctx.arc(endX, endY - 8, 2.5, 0, Math.PI * 2); ctx.fill();
                            }
                            ctx.restore();
                        }
                    }
                };

                const animate = (time) => {
                    if (!lastTimeRef.current) lastTimeRef.current = time;
                    const delta = time - lastTimeRef.current;
                    lastTimeRef.current = time;

                    if (musicStarted && !isComplete) {
                        // Update cycle time (0-10s cycle for slower breathing)
                        cycleRef.current = (cycleRef.current + delta) % 10000;
                        setCycleTime(cycleRef.current / 1000);

                        // Grow whenever pressing
                        if (isPressing) {
                            // Grow 60s of total pressing time to full (1.0)
                            growthRef.current = Math.min(1, growthRef.current + delta / 60000);
                            setGrowth(growthRef.current);
                            if (growthRef.current >= 1) {
                                setIsComplete(true);
                            }
                        }
                    }

                    // Sway animation
                    const currentSway = Math.sin(time / 1500) * 2; // Slower sway
                    // Canvas Drawing
                    const canvas = canvasRef.current;
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        const rect = canvas.getBoundingClientRect();
                        
                        // Match resolution to display size for sharpness
                        const dpr = window.devicePixelRatio || 1;
                        if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
                            canvas.width = rect.width * dpr;
                            canvas.height = rect.height * dpr;
                        }
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.save();
                        ctx.scale(dpr, dpr);
                        
                        // Map SVG coordinate system to Canvas
                        // SVG: viewBox="-200 -450 400 500"
                        const scale = rect.width / 400;
                        ctx.translate(rect.width / 2, rect.height * 0.92);
                        ctx.scale(scale, scale);
                        
                        if (treeStructureRef.current) {
                            drawBranch(ctx, treeStructureRef.current, 0, 0, 0, growthRef.current, 8, currentSway);
                        }
                        ctx.restore();
                    }

                    frame = requestAnimationFrame(animate);
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [isPressing, isComplete, musicStarted]);

            const isInhalePhase = cycleTime < 5;
            const glowScale = musicStarted && !isComplete ? (isInhalePhase ? (cycleTime / 5) : (1 - (cycleTime - 5) / 5)) : 0;

                    if (audioRef.current) {
                        const audio = audioRef.current;
                        const remainingTime = audio.duration - audio.currentTime;
                        
                        // Start fade out when 20 seconds are remaining
                        if (remainingTime <= 20 && !fadeIntervalRef.current && !audio.paused) {
                            const startVolume = audio.volume;
                            const duration = remainingTime * 1000; // Use remaining time for fade duration
                            const steps = 400;
                            const interval = duration / steps;
                            const volumeStep = startVolume / steps;

                            fadeIntervalRef.current = setInterval(() => {
                                step++;
                                if (step >= steps) {
                                    audio.pause();
                                    audio.volume = 1;
                                    setIsPlaying(false);
                                    clearInterval(fadeIntervalRef.current);

                                } else {
                                    audio.volume = Math.max(0, startVolume - (volumeStep * step));
                                }
                            }, interval);
                        }

                };

                    setSelectedPart(null);
                    setIsPlaying(false);

        const EMOTION_DEFINITIONS = {
            p1: { title: "開心", desc: "臉上有笑容，\n覺得心裡很舒服。" },
